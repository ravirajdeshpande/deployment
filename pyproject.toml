[project]
name = "humanizer-agent"
version = "0.3.0"
# Vercel installs from this table, not requirements.txt, whenever pyproject.toml exists.
# Keep it identical to requirements.txt; tests/unit/test_packaging.py enforces that.
dependencies = [
  "fastapi==0.141.1",
  "langchain-core==1.6.1",
  "langchain-openai==1.6.0",
  "langgraph==1.2.11",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "uvicorn==0.52.4",
  "langsmith==0.14.3",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
  "live: calls the live OpenAI API",
  "eval: runs cost-capped quality evaluations",
  "storage: requires a storage service or emulator",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]